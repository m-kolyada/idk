<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НМТ: подготовка — формулы, правила, тесты</title>
<style>
  :root { --bg: #fbfbfa; --fg: #1a1a18; --dim: #6b6b66; --line: #e4e4e0;
          --card: #ffffff; --accent: #2b5fd9; --ok: #1a7f44; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #f0f0ee; --dim: #9a9a95; --line: #2e2e34;
            --card: #1e1e24; --accent: #7aa2f7; --ok: #4fc47f; --bad: #ff7a6b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 64px; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  main { max-width: 44rem; width: 100%; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .4rem; }
  h2 { font-size: 1.25rem; margin: 2rem 0 .75rem; }
  h3 { font-size: 1.05rem; margin: 0 0 .5rem; }
  p { margin: 0 0 .75rem; }
  .dim { color: var(--dim); }
  .small { font-size: .9rem; }

  /* Переключатели: предметы и режим (теория / тест) */
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; }
  button {
    font: inherit; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Карточка темы и карточка вопроса */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
  }
  .formula {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; margin: 0 0 6px; display: block;
    overflow-x: auto; white-space: nowrap;
  }
  .formula-slovami { margin: 0 0 12px; }
  ol.steps { margin: 0; padding-left: 1.3rem; }
  ol.steps li { margin-bottom: .3rem; }

  /* Варианты ответа — колонкой, чтобы палец попадал на телефоне */
  .varianty { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 0; }
  .varianty button { text-align: left; }
  .razbor { margin-top: 12px; border-left: 3px solid var(--accent); padding-left: 12px; }
  .verno { color: var(--ok); font-weight: 600; }
  .neverno { color: var(--bad); font-weight: 600; }

  textarea {
    width: 100%; min-height: 8rem; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; resize: vertical;
  }
</style>
</head>
<body>
<main>

  <h1>Подготовка к НМТ</h1>
  <p class="dim">Формулы и правила — чтобы переписать в тетрадь. Гайды — как решать по шагам. Тест — чтобы проверить, что навык появился.</p>

  <!-- Сюда скрипт вставляет кнопки предметов -->
  <nav id="nav-predmety"></nav>
  <!-- Сюда скрипт вставляет кнопки «Теория» / «Тест» -->
  <nav id="nav-rezhim"></nav>

  <!-- Сюда скрипт вставляет содержимое выбранного предмета -->
  <div id="soderzhimoe"></div>

</main>

<script>
/* ======================================================================

   Чтобы добавить тему — допиши объект в "temy" нужного предмета.
   Чтобы добавить вопрос — допиши объект в "test" нужного предмета.
   Трогать код ниже данных для этого НЕ нужно.

   Формат темы:   { nazvanie, formuly: [{ znak, slovami }], kakReshat: [строки] }

        ]
      }
    ],
    test: [
      { tema: "Проценты", vopros: "Сколько составляет 15% от 240?",
        varianty: ["36", "24", "32", "40"], pravilnyi: 0,
        razbor: "15% = 0,15. Значит 240 · 0,15 = 36. Проверка: 10% это 24, ещё 5% это 12, вместе 36." },

      { tema: "Дроби и пропорции", vopros: "Найди x из пропорции 3/4 = x/20.",
        varianty: ["12", "15", "16", "18"], pravilnyi: 1,
        razbor: "Крест-накрест: 3 · 20 = 4 · x, то есть 60 = 4x, значит x = 15." },

      { tema: "Формулы сокращённого умножения", vopros: "Чему равно 17² − 13²?",
        varianty: ["60", "90", "120", "150"], pravilnyi: 2,
        razbor: "Разность квадратов: (17 − 13)(17 + 13) = 4 · 30 = 120. Считать 289 − 169 в лоб дольше." },

        varianty: ["2⁷ = 128", "2¹² = 4096", "4⁷", "2⁵ = 32"], pravilnyi: 0,
        razbor: "Основания одинаковые — показатели складываются: 3 + 4 = 7, значит 2⁷ = 128." },

      { tema: "Степени и корни", vopros: "Упрости √50.",

        razbor: "50 = 25 · 2, а √25 = 5. Выносим: √50 = 5√2." },

  /* Заготовки на будущее. Когда дойдёт очередь — наполняй "temy" и "test"

  { id: "angliyskiy", nazvanie: "Английский", temy: [], test: [] },

/* ======================================================================
   КОД. Ниже — сборка страницы из данных выше.
   ====================================================================== */

// Что сейчас открыто
let predmetId = PREDMETY[0].id;
let rezhim = "teoriya";          // "teoriya" или "test"
let otvety = {};                 // номер вопроса -> номер выбранного варианта

// Безопасный текст: чтобы данные не ломали вёрстку
function tekst(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function tekushchiyPredmet() {
  return PREDMETY.find(function (p) { return p.id === predmetId; });
}

// Кнопки предметов
function narisuyNavPredmety() {
  document.getElementById("nav-predmety").innerHTML = PREDMETY.map(function (p) {
    return '<button data-predmet="' + p.id + '" aria-pressed="' + (p.id === predmetId) + '">' +
           tekst(p.nazvanie) + '</button>';
  }).join("");
}

// Кнопки «Теория» / «Тест»
function narisuyNavRezhim() {
  const t = tekushchiyPredmet();
  document.getElementById("nav-rezhim").innerHTML =
    '<button data-rezhim="teoriya" aria-pressed="' + (rezhim === "teoriya") + '">Формулы и правила (' + t.temy.length + ')</button>' +
    '<button data-rezhim="test" aria-pressed="' + (rezhim === "test") + '">Тест (' + t.test.length + ')</button>';
}

// Раздел «Формулы и правила»: формула, что она значит словами, и шаги решения
function teoriyaHTML(p) {
  if (p.temy.length === 0) {
    return '<div class="card"><p>По предмету «' + tekst(p.nazvanie) + '» формул пока нет.</p>' +
           '<p class="dim small">Это заготовка. Темы добавляются в список PREDMETY в начале файла — ' +
           'в поле "temy" этого предмета, в том же формате, что у математики.</p></div>';
  }
  return p.temy.map(function (tema) {
    const formuly = tema.formuly.map(function (f) {
      return '<code class="formula">' + tekst(f.znak) + '</code>' +
             '<p class="formula-slovami small dim">' + tekst(f.slovami) + '</p>';
    }).join("");
    const shagi = tema.kakReshat.map(function (s) {
      return '<li>' + tekst(s) + '</li>';
    }).join("");
    return '<section class="card">' +
             '<h3>' + tekst(tema.nazvanie) + '</h3>' +
             formuly +
             '<p class="small"><strong>Как решать</strong></p>' +
             '<ol class="steps small">' + shagi + '</ol>' +
           '</section>';
  }).join("") + zapisiHTML();
}

// Место для своих записей: формулы переписываешь в тетрадь, а сюда — свои слова
function zapisiHTML() {
  return '<section class="card">' +
           '<h3>Мои записи по предмету</h3>' +
           '<p class="small dim">Выпиши своими словами то, что забывается. Текст остаётся в этом браузере.</p>' +
           '<textarea id="zapisi" placeholder="Например: в (a+b)² я забываю средний член 2ab."></textarea>' +
         '</section>';
}

// Тест: вопрос, варианты, после ответа — разбор решения
function testHTML(p) {
  if (p.test.length === 0) {
    return '<div class="card"><p>По предмету «' + tekst(p.nazvanie) + '» вопросов пока нет.</p>' +
           '<p class="dim small">Вопросы добавляются в поле "test" этого предмета в списке PREDMETY.</p></div>';
  }

  const vsego = p.test.length;
  let verno = 0;
  for (const nomer in otvety) {
    if (p.test[nomer] && otvety[nomer] === p.test[nomer].pravilnyi) { verno++; }
  }
  const otvecheno = Object.keys(otvety).length;

  const schet = '<div class="card"><p><strong>Отвечено: ' + otvecheno + ' из ' + vsego +
                '. Верно: ' + verno + '.</strong></p>' +
                '<button id="sbros">Начать тест заново</button></div>';

  const voprosy = p.test.map(function (v, i) {
    const vybran = otvety[i];
    const estOtvet = (vybran !== undefined);

    const varianty = v.varianty.map(function (text, j) {
      let metka = "";
      if (estOtvet && j === v.pravilnyi) { metka = " ✔"; }
      if (estOtvet && j === vybran && j !== v.pravilnyi) { metka = " ✘"; }
      const nazhata = (estOtvet && j === vybran);
      return '<button data-vopros="' + i + '" data-variant="' + j + '" aria-pressed="' + nazhata + '">' +
             tekst(text) + metka + '</button>';
    }).join("");

    let razbor = "";
    if (estOtvet) {
      const itog = (vybran === v.pravilnyi)
        ? '<span class="verno">Верно.</span>'
        : '<span class="neverno">Неверно.</span> Правильный ответ: ' + tekst(v.varianty[v.pravilnyi]) + '.';
      razbor = '<div class="razbor small"><p>' + itog + '</p><p>' + tekst(v.razbor) + '</p></div>';
    }

    return '<section class="card">' +
             '<p class="small dim">Вопрос ' + (i + 1) + ' из ' + vsego + ' · ' + tekst(v.tema) + '</p>' +
             '<p><strong>' + tekst(v.vopros) + '</strong></p>' +
             '<div class="varianty">' + varianty + '</div>' +
             razbor +
           '</section>';
  }).join("");

  return schet + voprosy;
}

function narisuy() {
  const p = tekushchiyPredmet();
  narisuyNavPredmety();
  narisuyNavRezhim();
  document.getElementById("soderzhimoe").innerHTML =
    (rezhim === "teoriya") ? teoriyaHTML(p) : testHTML(p);
  if (rezhim === "teoriya") { podklyuchiZapisi(p); }
}

// Записи храним в браузере. Если хранилище недоступно — страница всё равно работает.
function podklyuchiZapisi(p) {
  const pole = document.getElementById("zapisi");
  if (!pole) { return; }
  const klyuch = "zapisi-" + p.id;
  try { pole.value = localStorage.getItem(klyuch) || ""; } catch (e) { /* ничего */ }
  pole.addEventListener("input", function () {
    try { localStorage.setItem(klyuch, pole.value); } catch (e) { /* ничего */ }
  });
}

// Один обработчик на все кнопки страницы
document.addEventListener("click", function (e) {
  const knopka = e.target.closest("button");
  if (!knopka) { return; }

  if (knopka.dataset.predmet) {
    predmetId = knopka.dataset.predmet;
    otvety = {};
    narisuy();
  } else if (knopka.dataset.rezhim) {
    rezhim = knopka.dataset.rezhim;
    narisuy();
  } else if (knopka.dataset.vopros) {
    otvety[knopka.dataset.vopros] = Number(knopka.dataset.variant);
    narisuy();
  } else if (knopka.id === "sbros") {
    otvety = {};
    narisuy();
  }
});

narisuy();
</script>
</body>
</html>
